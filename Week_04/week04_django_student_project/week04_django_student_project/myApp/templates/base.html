<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}My University{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#243247}
header{background:#17365d;color:white;padding:24px 8%}header h1{margin:0}
nav{background:#102844;padding:12px 8%}nav a{color:white;text-decoration:none;margin-right:18px}
main{max-width:900px;margin:30px auto;padding:0 20px;min-height:55vh}
.panel{background:white;padding:24px;border-radius:10px;box-shadow:0 2px 8px #00000012}
a{color:#1769aa}li{margin:12px 0}footer{background:#17365d;color:white;text-align:center;padding:18px}
</style>
</head>
<body>
<header><h1>My University</h1><p>Student information website</p></header>
<nav><a href="{% url 'home' %}">Home</a><a href="/admin/">Admin</a></nav>
<main>{% block content %}{% endblock %}</main>
<footer>Week 04 Django Templates and ORM Practical</footer>
</body></html>
